<!DOCTYPE html>
<html lang="vi" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logoGTXX.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Giải Toán Xác Suất - THPT Chuyên Sâu</title>
    <meta name="description" content="Ứng dụng Giải Toán Xác Suất - Giải chi tiết từng bước các dạng toán lớp 10, 11, 12 THPT theo chương trình GDPT mới. Tự động rút gọn phân số, sơ đồ cây Bayes và công thức chuẩn KaTeX." />
    <!-- Google Fonts: Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <!-- KaTeX CSS from CDN for instant style availability -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" integrity="sha384-nB0miv6/jRmo5UMMR1wu3Gz6NLsoTkbqJghGIsx//Rlm+ZU03BU6SQNC66uf4l5+" crossorigin="anonymous">
    <!-- Immediate theme initialization script -->
    <script>
      (function() {
        try {
          var t = localStorage.getItem('app_theme');
          if (t === 'light') {
            document.documentElement.classList.remove('dark');
            document.documentElement.setAttribute('data-theme', 'light');
          } else {
            document.documentElement.classList.add('dark');
            document.documentElement.setAttribute('data-theme', 'dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-slate-950 text-slate-100 antialiased min-h-screen selection:bg-brand-500/30 selection:text-brand-300">
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
